<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box of Memories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              hand: ['"Dancing Script"', 'cursive'],
              serif: ['"Playfair Display"', '"Noto Serif SC"', 'serif'],
              sans: ['"Montserrat"', 'sans-serif'],
              typewriter: ['"Special Elite"', 'monospace'],
              neon: ['"Courier Prime"', 'monospace'], // Fallback for neon
            },
            colors: {
              paper: '#fdfbf7',
              'glass-edge': 'rgba(255, 255, 255, 0.6)',
              'glass-surface': 'rgba(255, 255, 255, 0.1)',
              'glass-shadow': 'rgba(0, 0, 0, 0.1)',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <script>
      // Robust Font Loading for html-to-image compatibility
      // We fetch the CSS text and inject it into a <style> tag.
      // This bypasses the "Cross-Origin" stylesheet restriction that prevents reading cssRules.
      (async function() {
        const fontUrl = "https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:wght@300;400;600&family=Noto+Serif+SC:wght@400;700;900&family=Special+Elite&display=swap";
        try {
          const response = await fetch(fontUrl);
          if (!response.ok) throw new Error("Network response was not ok");
          const css = await response.text();
          const style = document.createElement('style');
          style.innerHTML = css;
          document.head.appendChild(style);
          console.log("Fonts injected successfully via JS");
        } catch (e) {
          console.warn("Manual font injection failed. Fallback to standard link.", e);
          const link = document.createElement('link');
          link.href = fontUrl;
          link.rel = 'stylesheet';
          // Important: try to request anonymous access for CORS if possible, though mostly affects font files
          link.crossOrigin = "anonymous"; 
          document.head.appendChild(link);
        }
      })();
    </script>
    <style>
      body {
        background-color: #e5e5f7;
        /* Geometric modern background pattern */
        background-image:  linear-gradient(#d5d5ed 2px, transparent 2px), linear-gradient(90deg, #d5d5ed 2px, transparent 2px), linear-gradient(#d5d5ed 1px, transparent 1px), linear-gradient(90deg, #d5d5ed 1px, transparent 1px);
        background-size: 50px 50px, 50px 50px, 10px 10px, 10px 10px;
        background-position: -2px -2px, -2px -2px, -1px -1px, -1px -1px;
        overflow-x: hidden;
      }
      /* 3D Box Styles */
      .scene {
        perspective: 1200px;
      }
      .box-group {
        transform-style: preserve-3d;
      }
      /* Utilities for React 3D rendering */
      .preserve-3d {
        transform-style: preserve-3d;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
